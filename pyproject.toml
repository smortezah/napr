[project]
name = "napr"
version = "0.2.0"
description = "Machine learning meets natural products"
authors = [{ name = "Morteza Hosseini" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "keras-tuner>=1.4.8",
    "matplotlib>=3.10.9",
    "requests>=2.34.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
